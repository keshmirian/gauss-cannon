name: Create Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Update manifest version
      run: |
        sed -i 's/version = ".*"/version = "${{ steps.version.outputs.VERSION }}"/' addon/blender_manifest.toml

    - name: Create addon zip
      run: |
        # Create temporary directory for packaging
        mkdir -p temp/gauss_cannon

        # Copy addon files to temporary directory
        cp -r addon/* temp/gauss_cannon/

        # Create the zip file
        cd temp
        zip -r ../gauss-cannon-${{ steps.version.outputs.TAG }}.zip gauss_cannon/
        cd ..

        # Verify the zip contents
        echo "Zip contents:"
        unzip -l gauss-cannon-${{ steps.version.outputs.TAG }}.zip

    - name: Generate release notes
      id: release_notes
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        if [ -n "$PREVIOUS_TAG" ]; then
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## Changes since $PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## Initial Release" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "This is the first release of Gauss Cannon." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        name: Gauss Cannon ${{ steps.version.outputs.TAG }}
        body: |
          ${{ steps.release_notes.outputs.RELEASE_NOTES }}

          ## Installation

          1. Download the `gauss-cannon-${{ steps.version.outputs.TAG }}.zip` file below
          2. In Blender, go to Edit → Preferences → Get Extensions
          3. Click the dropdown menu in the top-right of the panel and choose "Install from Disk..."
          4. Select the downloaded zip file
          5. Enable the "Gauss Cannon" add-on
          6. The panel will appear in the 3D viewport's N-panel under "Gauss Cannon"

          To uninstall or update later, find Gauss Cannon under Edit → Preferences → Get Extensions (or the Add-ons tab) and use the dropdown arrow next to the entry.

          ## Requirements

          - Blender 4.2.0 or higher
          - GPU support recommended for point cloud generation
        files: ./gauss-cannon-${{ steps.version.outputs.TAG }}.zip
        draft: false
        prerelease: false